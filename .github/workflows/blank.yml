name: RemoteLink Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    name: Build RemoteLink debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'RemoteLink-Android-0.2.1-Device-Profile*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo 'Project ZIP not found in repository root.'
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d source
          test -f source/RemoteLink/settings.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted Ubuntu runners already include the Android SDK.
      # Avoid android-actions/setup-android here: it is failing while
      # trying to install the obsolete SDK package named "tools".
      - name: Locate preinstalled Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Using $SDKMANAGER"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true

      - name: Install Android SDK components
        shell: bash
        run: |
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test signaling server
        working-directory: source/RemoteLink/backend
        run: |
          npm install
          npm test

      - name: Build Android debug APK
        working-directory: source/RemoteLink
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RemoteLink-debug-apk
          path: source/RemoteLink/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
